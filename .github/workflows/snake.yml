# ═══════════════════════════════════════════════════════════════════
#  🐍 Snake — regenerates the contribution-grid snake animation and
#  publishes it to the `output` branch, which README.md embeds.
#
#  • Runs every 12 hours, on every push to main, and on demand
#    (Actions tab → "🐍 Snake" → Run workflow).
#  • Needs no secrets beyond the automatic GITHUB_TOKEN.
# ═══════════════════════════════════════════════════════════════════
name: 🐍 Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Emerald-dev0
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 regenerate snake [skip ci]"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
